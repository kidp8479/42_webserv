server {
    listen 127.0.0.1:1;
    location /scripts {
        methods GET POST;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
    }
}

server {
    listen 127.0.0.1:65535;
    location /scripts {
        methods GET POST;
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
    }
}