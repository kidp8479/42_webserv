# make demo && ./webserv
# curl http://127.0.0.1:8080 => server 1
# curl http://127.0.0.1:8081 => server 2, different content
# curl -v http://127.0.0.1:8080/redirect => see the 301 to /destination
# curl -v -X POST http://127.0.0.1:8080/uploads/test.txt --data-binary "hello" => upload a file
# curl -L http://127.0.0.1:8080/received => browse uploaded files
# curl -v -X DELETE http://127.0.0.1:8080/delete/files/file1.txt => delete a file
# curl -L http://127.0.0.1:8080/delete/files => browse deletable files
# curl -v -X DELETE http://127.0.0.1:8080/ => 405 test, DELETE on a GET only route
# curl -v http://127.0.0.1:8080/coffee => easter egg

server {
    listen 127.0.0.1:8080;

    # the default value for client_max_body_size directive in nginx is 1 MB
    client_max_body_size 1M;

    # common HTTP errors a server can encounter - all mapped to a dedicated html page
    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 414 www/errors/414.html;
    error_page 431 www/errors/431.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    # all location blocks, one per feature required by the subject

    # serving static files
    location / {
        methods GET; # only static files served here, no need for other methods
        root www/default/html; # files to serve are looked up in this folder
        index index.html; # if the request points to a directory (ex: /), default to index.html
        autoindex off; # no directory listing
    }

    # file upload
    location /uploads {
        methods POST; # only POST needed, we store files not serve them
        upload_path www/default/upload/received; # where uploaded files are stored on the server
        autoindex off;
    }

    # browse uploaded files
    location /received {
        methods GET;
        root www/default/upload; # /received => www/default/upload/received/
        autoindex on;
    }

    # error pages
    location /errors {
        methods GET; # read-only html pages
        root www; # www + /errors/404.html = www/errors/404.html
        # no index directive - we never point to the folder, always to a specific file (ex: /errors/404.html)
        autoindex off;
    }

    # redirection - no root, no methods needed, just a code and a destination
    location /redirect {
        return 301 /destination; # 301 = moved permanently, redirects to /destination
    }

    # redirect destination page
    location /destination {
        methods GET;
        root www/default;
        index redirect_destination.html;
        autoindex off;
    }

    # easter egg
    location /coffee {
        methods GET;    
        root www;
        index 418.html;
        autoindex off;
    }

    location /img {
        methods GET;
        root www;
        autoindex off;
    }

    # file deletion
    location /delete {
        methods GET DELETE; # GET with autoindex to browse, DELETE to remove
        root www/default;
        index index.html; # info page with fetch() form at /delete/
        autoindex on;
    }

    # CGI - executes scripts based on file extension
    location /cgi-bin {
        methods GET POST; # GET to request a script, POST to send data to it
        root www; # www + /cgi-bin/script.php = www/cgi-bin/script.php
        cgi .php /usr/bin/php-cgi; # .php files executed with php-cgi - where the binary to execute some php is - this is machine dependant, needs to check at school IF php-cgi is installed
        cgi .py /usr/bin/python3;  # .py files executed with python3 - this is machine dependant, needs to check at school IF python is installed
        autoindex off;
    }

    location /css {
        methods GET;
        root www;
        autoindex off;
    }
}

# second server block on a different port - demonstrates the subject requirement:
# "your server must be able to listen to multiple ports to deliver different content"
server {
    listen 127.0.0.1:8081;

    client_max_body_size 1M;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    location / {
        methods GET;
        root www/default/html2; # serves different content than port 8080
        index index.html;
        autoindex off;
    }

    location /css {
        methods GET;
        root www;
        autoindex off;
    }

}
