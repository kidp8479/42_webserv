# ./webserv conf/demo_cgi.conf
# then open: http://127.0.0.1:8085/cgi-bin/test.py

server {

    listen 127.0.0.1:8086;

    client_max_body_size 1M;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

	location / {
		methods GET;
		root www/demo/cgi/html;
        index index.html;
    }

	location /cgi-bin {
		methods GET POST;
		cgi .py /usr/bin/python3;
		root www/cgi-bin;
	}
	
    location /upload {
        methods POST;
        upload_path www/demo/upload/received;
        autoindex off;
	}

    # browse uploaded files
    location /received {
        methods GET;
        root www/demo/upload;
        autoindex on;
    }

    location /css {
        methods GET;
        root www;
        autoindex off;
    }
}
