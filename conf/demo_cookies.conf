# demo_cookies.conf - cookie and session management demo
# run: ./webserv conf/demo_cookies.conf
#
# test with browser:
#   http://127.0.0.1:8087/cookie-session        => static page, shows session cookie via JS
#   http://127.0.0.1:8087/cgi-bin/cookie_info.sh  => shell CGI, reads HTTP_COOKIE env var

server {
    listen 127.0.0.1:8087;

    client_max_body_size 1M;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    # prevent favicon from triggering the / redirect and incrementing visit count
    # serves from an empty directory so it naturally 404s without redirecting
    location /favicon.ico {
        methods GET;
        root www/errors;
        autoindex off;
    }

    # root redirects to the session demo page
    location / {
        return 301 /cookie-session;
    }

    # cookie session demo page - static HTML that reads document.cookie via JS
    location /cookie-session {
        methods GET;
        root www/demo;
        index index.html;
        autoindex off;
    }

    # CGI - two interpreters to demonstrate multi-CGI support
    # .py => Python3 (hello.py, cgi.py, upload.py)
    # .sh => bash shell script (cookie_info.sh reads HTTP_COOKIE)
    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin; # strip /cgi-bin prefix from URI, prepend root: www/cgi-bin + /script.sh
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        autoindex off;
    }

    location /css {
        methods GET;
        root www;
        autoindex off;
    }
}
