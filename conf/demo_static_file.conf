# ./webserv conf/demo_static_file.conf and open http://127.0.0.1:8082
# curl http://127.0.0.1:8082/ => (serves index.html, full request cycle visible in server logs)

server {

    listen 127.0.0.1:8082;

    client_max_body_size 10M;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 414 www/errors/414.html;
    error_page 431 www/errors/431.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    location / {
        methods GET;
        root www/demo/static/html;
        index index.html;
    }

    location /css {
        methods GET;
        root www;
        autoindex off;
    }
}