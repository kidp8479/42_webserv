# make demo && ./webserv conf/demo_delete.conf and open http://127.0.0.1:8085 to test

server {

    listen 127.0.0.1:8085;

    client_max_body_size 1M;

    error_page 400 www/errors/400.html;
    error_page 403 www/errors/403.html;
    error_page 404 www/errors/404.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 500 www/errors/500.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    # info page with delete UI
    location / {
        methods GET;
        root www/demo/delete/html;
        index index.html;
        autoindex off;
    }

    # files available for deletion - autoindex lists them, DELETE removes them
    location /files {
        methods GET DELETE;
        root www/demo/delete;
        autoindex on;
    }
}
